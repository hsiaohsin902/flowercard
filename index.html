<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花語靈感卡 - 高畫質正方形圖片版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #f7f4ee; --dot-color: #e6dfd3;
            --text-main: #5c4f4a; --text-light: #8a7c75;
            --dark-green: #3d5646; --light-green: #dce4d5;
            --red-brown: #b56c66; --card-border: #e3dcd1;
            --card-bg: #fcfbfa;
        }

        body {
            font-family: "Helvetica Neue", Arial, "微軟正黑體", sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--dot-color) 1.5px, transparent 1.5px);
            background-size: 20px 20px; color: var(--text-main);
            margin: 0; padding: 20px; display: flex; flex-direction: column;
            align-items: center; min-height: 100vh;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 900px; margin-bottom: 60px;
        }
        .header-title { font-size: 16px; font-weight: bold; color: #6d5b51; display: flex; align-items: center; gap: 8px; }
        .admin-btn { background-color: #e9e3d9; color: #5c4f4a; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .admin-btn:hover { background-color: #dbd3c6; }

        .prompt-text { font-size: 14px; color: var(--text-main); margin-bottom: 20px; letter-spacing: 1px; }
        .draw-btn {
            background-color: var(--dark-green); color: white; border: none; padding: 12px 35px; border-radius: 30px;
            font-size: 16px; cursor: pointer; transition: 0.3s; letter-spacing: 1px; box-shadow: 0 4px 12px rgba(61, 86, 70, 0.2);
        }
        .draw-btn:hover { background-color: #2f4336; transform: translateY(-2px); }

        .card-container { margin: 30px 0; display: none; }
        .card {
            width: 320px; height: 520px;
            background-color: var(--card-bg); border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06); padding: 8px; box-sizing: border-box; position: relative;
        }
        .card-inner {
            border: 1px dashed var(--card-border); border-radius: 8px; background-color: #ffffff;
            width: 100%; height: 100%; box-sizing: border-box; padding: 18px; display: flex; flex-direction: column;
        }

        .card-img-placeholder {
            width: 220px; height: 220px; 
            margin: 0 auto 15px auto; 
            background-color: #f7f7f7; border-radius: 8px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; overflow: hidden; border: 1px solid #f0f0f0; color: #bcbcbc; font-size: 13px;
        }
        .card-img-placeholder svg { width: 40px; height: 40px; fill: #d4d4d4; margin-bottom: 8px; }
        .card-img-placeholder img { width: 100%; height: 100%; object-fit: cover; }

        /* --- 修正排版：防止花名被擠壓換行 --- */
        .card-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #f2eee8; gap: 6px; }
        .card-no { font-size: 12px; font-weight: bold; color: #a48c77; letter-spacing: 1px; flex-shrink: 0; }
        .card-title { 
            font-size: 28px; color: var(--dark-green); font-family: 'Noto Serif TC', serif; 
            font-weight: 700; letter-spacing: 2px; margin: 0; 
            white-space: nowrap; /* 確保標題絕對不換行 */
            flex-shrink: 0;      /* 確保標題不會被壓縮 */
        }
        .card-pill { 
            background-color: var(--light-green); color: var(--dark-green); 
            font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 12px; 
            line-height: 1.3; text-align: center; /* 讓較長的關鍵字優雅地換行 */
        }

        .card-quote-box { border: 1px solid #f2eee8; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.01); margin-bottom: 15px; }
        .card-quote { font-size: 15px; color: #333; font-family: 'Noto Serif TC', serif; line-height: 1.6; font-weight: 600; }

        .meaning-section { margin-top: auto; }
        .meaning-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .meaning-label { background-color: var(--red-brown); color: white; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
        .meaning-keywords { font-size: 13px; font-weight: bold; color: #5c4f4a; }
        .meaning-desc { font-size: 11px; color: #7a6e67; line-height: 1.5; text-align: justify; }

        .admin-panel {
            display: none; width: 100%; max-width: 800px; background: white; padding: 30px;
            border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-top: 20px;
        }
        .admin-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .admin-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; margin-right: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .file-input { font-size: 12px; }

        .export-btn { background-color: #c4b5a3; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; display: none; margin-top: 15px; }

        .action-bars { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center; }
        .primary-btn { background-color: var(--dark-green); color:white; padding:10px 20px; border:none; border-radius:20px; cursor:pointer; font-weight: bold; letter-spacing: 1px; }
        .secondary-btn { background-color: #8a7c75; color:white; padding:10px 20px; border:none; border-radius:20px; cursor:pointer; font-weight: bold; letter-spacing: 1px; }
        .batch-btn { background-color: var(--red-brown); color:white; padding:10px 20px; border:none; border-radius:20px; cursor:pointer; font-weight: bold; letter-spacing: 1px; position: relative; }
        
        .print-cb { margin-right: 15px; transform: scale(1.3); cursor: pointer; }

        /* --- 完美 A4 列印排版設定 --- */
        @page {
            size: A4 portrait;
            margin: 10mm 0; 
        }
        @media print {
            .header, #main-content, #admin-panel { display: none !important; }
            body { margin: 0; padding: 0; background: white; }
            
            #print-area { 
                display: grid !important; 
                width: 100%; 
                grid-template-columns: repeat(3, 63mm); 
                justify-content: center; 
                gap: 5mm 4mm; 
                box-sizing: border-box; 
            }
            
            .print-card { 
                width: 63mm; height: 88mm; 
                background-color: #ffffff !important; 
                border: 1px solid #e3dcd1; padding: 2mm; border-radius: 3mm; 
                box-sizing: border-box; -webkit-print-color-adjust: exact; 
                page-break-inside: avoid; break-inside: avoid; 
            }
            .print-card-inner { border: 1px dashed #e3dcd1; border-radius: 2mm; width: 100%; height: 100%; padding: 4mm; box-sizing: border-box; display: flex; flex-direction: column; }
            .print-card .card-img-placeholder { width: 32mm; height: 32mm; margin: 0 auto 2mm auto; border: none; border-radius: 4px; }
            
            /* 列印時也保證標題不換行 */
            .print-card .card-header-row { margin-bottom: 2mm; padding-bottom: 2mm; align-items: center; gap: 2px; }
            .print-card .card-no { font-size: 6pt; flex-shrink: 0; }
            .print-card .card-title { font-size: 14pt; margin: 0; white-space: nowrap; flex-shrink: 0; letter-spacing: 1px; }
            .print-card .card-pill { font-size: 4.5pt; padding: 2px 4px; line-height: 1.2; text-align: center; }
            
            .print-card .card-quote-box { padding: 4mm; margin-bottom: 3mm; }
            .print-card .card-quote { font-size: 7.5pt; }
            .print-card .meaning-label { font-size: 5pt; padding: 1px 3px; flex-shrink: 0; }
            .print-card .meaning-keywords { font-size: 6pt; }
            .print-card .meaning-desc { font-size: 4.8pt; line-height: 1.4; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#6d5b51"><path d="M12,22V10M12,10C12,10 16,10 16,6C16,2 12,2 12,2C8,2 8,6 8,10C8,14 12,10 12,10Z"/></svg>
            花語靈感卡
        </div>
        <button class="admin-btn" onclick="toggleAdmin()">⚙️ 圖片與列印管理</button>
    </div>

    <div id="main-content" style="display:flex; flex-direction:column; align-items:center; width:100%;">
        <div class="prompt-text">深呼吸，在心裡默想一個問題，或單純祈求今日的指引</div>
        <button class="draw-btn" onclick="drawCard()">抽取專屬花語</button>
        
        <div class="card-container" id="card-container">
            <div class="card" id="card-capture-area">
                <div class="card-inner">
                    <div class="card-img-placeholder" id="card-img">
                        <svg viewBox="0 0 24 24"><path d="M21,19V5C21,3.89 20.1,3 19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19M8.5,13.5L11,16.5L14.5,12L19,18H5L8.5,13.5Z"/></svg>
                        尚無圖片
                    </div>
                    
                    <div class="card-header-row">
                        <div class="card-no" id="card-no">NO.00</div>
                        <div class="card-title" id="card-title">花名</div>
                        <div class="card-pill" id="card-subtitle">關鍵字</div>
                    </div>

                    <div class="card-quote-box">
                        <div class="card-quote" id="card-quote">「療癒金句」</div>
                    </div>

                    <div class="meaning-section">
                        <div class="meaning-row">
                            <span class="meaning-label">花語</span>
                            <span class="meaning-keywords" id="card-meaning-kw">花語關鍵字</span>
                        </div>
                        <div class="meaning-desc" id="card-meaning-desc">象徵解釋</div>
                    </div>
                </div>
            </div>
        </div>

        <button class="export-btn" id="export-btn" onclick="exportCard()">📥 匯出這張卡片</button>
    </div>

    <!-- 後台管理區 -->
    <div class="admin-panel" id="admin-panel">
        <h2 style="color:var(--dark-green); margin-top:0;">圖片與列印管理</h2>
        
        <div class="action-bars">
            <button class="primary-btn" onclick="printAllCards()">🖨️ 列印全部 (27張)</button>
            <button class="secondary-btn" onclick="printSelectedCards()">🖨️ 列印勾選的卡片</button>
            
            <input type="file" id="batch-upload" multiple accept="image/*" style="display:none;" onchange="handleBatchUpload(event)">
            <button class="batch-btn" onclick="document.getElementById('batch-upload').click()">📁 大量上傳 (自動配對檔名)</button>
            
            <div style="margin-left:auto; display:flex; gap:8px;">
                <button class="admin-btn" onclick="toggleCheckboxes(true)">☑️ 全選</button>
                <button class="admin-btn" onclick="toggleCheckboxes(false)">☐ 取消全選</button>
            </div>
        </div>
        
        <div id="admin-list"></div>
    </div>

    <div id="print-area"></div>

    <script>
        const flowers = [
            { id: "01", name: "玫瑰", keywords: "愛與欣賞", quote: "「你不需要先變得完美，才值得被愛。」", flower_meaning: "愛情、熱情、感謝、欣賞、真誠。", meaning: "玫瑰常被用來表達愛與欣賞。這句話將愛從外在條件中抽離，提醒我們，值得被珍惜不必建立在成就、外貌或表現上。" },
            { id: "02", name: "茉莉花", keywords: "純真與溫柔", quote: "「溫柔不是軟弱，而是即使經歷過生活，仍願意善待自己與他人。」", flower_meaning: "純潔、優雅、溫柔、清新。", meaning: "茉莉花以細緻的花朵與清香給人柔和感受，象徵溫柔不代表沒有界線，而是保有善意。" },
            { id: "03", name: "康乃馨", keywords: "感謝與關懷", quote: "「謝謝你一直努力到今天，也別忘了把一些溫柔留給自己。」", flower_meaning: "感謝、敬愛、母愛、關懷。", meaning: "康乃馨經常與感謝及照顧連結。這句話把給予他人的感謝也轉向自己。" },
            { id: "04", name: "滿天星", keywords: "陪伴與守護", quote: "「不一定要成為最耀眼的人，你的存在，本身就有意義。」", flower_meaning: "純真、守護、陪伴、真摯的情感。", meaning: "滿天星常作為陪襯，卻能讓整體更完整。象徵每個人即使不在舞台中央，也能帶來重要影響。" },
            { id: "05", name: "繡球花", keywords: "感恩與連結", quote: "「我們不必長得一樣，也能在彼此身邊，組成美好的風景。」", flower_meaning: "感恩、團聚、圓滿、理解。", meaning: "繡球花由小花聚合成花球，象徵人際關係中的差異、接納與合作。" },
            { id: "06", name: "鬱金香", keywords: "真誠與幸福", quote: "「幸福不一定是轟轟烈烈，有時只是好好生活，並珍惜眼前的小事。」", flower_meaning: "愛、優雅、幸福、關懷。", meaning: "鬱金香外形簡潔優雅，象徵不必追求完美大事，也可以在平凡中感受幸福。" },
            { id: "07", name: "向日葵", keywords: "希望與樂觀", quote: "「即使現在身處陰影，也別忘了，你仍然可以慢慢尋找自己的光。」", flower_meaning: "希望、忠誠、崇敬、陽光、活力。", meaning: "向日葵象徵陽光，承認陰影存在，同時保留尋找方向的可能。" },
            { id: "08", name: "蓮花", keywords: "純淨與內在力量", quote: "「我無法選擇所有遭遇，卻可以慢慢找回屬於自己的力量。」", flower_meaning: "純潔、智慧、清淨、超越困境。", meaning: "蓮花生於淤泥卻開出清麗花朵，象徵在艱難環境中仍保有自己的價值。" },
            { id: "09", name: "鳶尾花", keywords: "希望與勇氣", quote: "「不必看清所有未來，只要找到下一步，就已經是在前進。」", flower_meaning: "希望、智慧、勇氣、信念。", meaning: "鳶尾花與信念有關，勇氣不一定是毫無恐懼，而是願意先走一步。" },
            { id: "10", name: "水仙花", keywords: "新生與重啟", quote: "「昨天的故事不必決定今天的你，每一天都可以重新開始。」", flower_meaning: "新生、希望、自我認識、重新開始。", meaning: "水仙花常在冬末春初綻放，提醒過去的挫折不必成為未來的唯一答案。" },
            { id: "11", name: "波斯菊", keywords: "和諧與自在", quote: "「不必急著成為誰期待的樣子，你可以按照自己的步調綻放。」", flower_meaning: "和諧、純真、自由、平凡的幸福。", meaning: "波斯菊花瓣輕盈自然，鼓勵人們按照自己的速度成長，不急於比較。" },
            { id: "12", name: "木槿花", keywords: "韌性與每一天的珍貴", quote: "「即使昨天沒有開得很好，今天的你，依然有再次綻放的機會。」", flower_meaning: "溫柔、堅韌、生命力。", meaning: "木槿花單朵開放短暫但植株持續開花，象徵一天的不順利不代表失去可能。" },
            { id: "13", name: "櫻花", keywords: "珍惜與生命之美", quote: "「有些美好不會永遠停留，但曾經擁有的溫暖，仍然值得珍惜。」", flower_meaning: "美麗、短暫、希望、新的開始。", meaning: "櫻花短暫提醒我們，即使美好會改變，它曾帶來的意義仍然存在。" },
            { id: "14", name: "劍蘭", keywords: "堅強與意志", quote: "「勇敢不是從來不害怕，而是害怕的時候，仍願意為自己走一步。」", flower_meaning: "堅強、勇氣、意志堅定、正直。", meaning: "劍蘭花莖挺直，將堅強重新定義為「即使脆弱，也能有所行動」。" },
            { id: "15", name: "萬壽菊", keywords: "活力與長久的祝福", quote: "「生命不必時時燦爛，只要還願意感受，平凡的日子也能有溫度。」", flower_meaning: "長壽、活力、祝福。", meaning: "鮮明色彩帶有祝福意涵，平靜地生活同樣有價值。" },
            { id: "16", name: "百合", keywords: "純潔與祝福", quote: "「願你在照顧別人的同時，也記得守護自己心中珍貴的部分。」", flower_meaning: "純潔、優雅、祝福、和諧。", meaning: "百合象徵保有內心的真誠與珍貴，而不是要求自己毫無缺點。" },
            { id: "17", name: "薰衣草", keywords: "平靜與安定", quote: "「你不必一直努力向前，有時候，停下來照顧自己也是一種前進。」", flower_meaning: "寧靜、忠誠、奉獻、等待愛情。", meaning: "薰衣草給人安定感受。休息不是偷懶，是恢復力量再決定下一步。" },
            { id: "18", name: "牡丹", keywords: "豐盛與幸福", quote: "「你值得擁有美好的生活，不必等到完成所有事情之後。」", flower_meaning: "富貴、繁榮、幸福、圓滿。", meaning: "牡丹象徵繁榮，享受幸福不必成為完成任務後才能得到的獎勵。" },
            { id: "19", name: "山茶花", keywords: "堅定與真摯", quote: "「即使世界不斷改變，也可以慢慢找到自己想珍惜的事物。」", flower_meaning: "欣賞、真摯的愛、堅定、優雅。", meaning: "山茶花象徵內在穩定，即使無法控制外在，仍可辨認自己的價值。" },
            { id: "20", name: "梔子花", keywords: "純真與守候", quote: "「即使有些美好還沒有到來，也可以先好好珍惜現在的自己。」", flower_meaning: "純潔、喜悅、守候、真摯。", meaning: "潔白清香給人純淨感受，常賦予守候意涵。將等待從被動盼望，轉化為在等待的過程中仍能好好充實生活。" },
            { id: "21", name: "牽牛花", keywords: "牽掛與珍惜", quote: "「重要的人不一定時時在身邊，但曾經給過彼此的溫暖，可以一直留在心裡。」", flower_meaning: "情感連結、牽掛、短暫的美好。", meaning: "牽牛花的攀附象徵人際連結，曾經的陪伴能成為生命一部分。" },
            { id: "22", name: "玉蘭花", keywords: "高潔與尊嚴", quote: "「你的價值不由別人的評價決定，你可以用自己的方式活得踏實而自在。」", flower_meaning: "高潔、優雅、尊貴、真摯。", meaning: "玉蘭花形簡潔，不必靠外界掌聲肯定自己，也不需失去原則。" },
            { id: "23", name: "罌粟花", keywords: "安慰與追思", quote: "「想念不必急著放下，我們可以帶著回憶，慢慢繼續生活。」", flower_meaning: "安慰、紀念、追思、休息。", meaning: "罌粟花在部分文化中與追思有關，療癒是找到與回憶共存的方式。" },
            { id: "24", name: "非洲菊", keywords: "快樂與活力", quote: "「你不必每天都很快樂，但仍然可以為自己留下一點值得期待的事。」", flower_meaning: "快樂、活力、樂觀、熱情。", meaning: "容許情緒有高低，同時鼓勵自己在平凡日子找到小期待。" },
            { id: "25", name: "菊花", keywords: "堅韌與從容", quote: "「不需要急著與誰競爭，按照自己的節奏生活，也是一種力量。」", flower_meaning: "高潔、堅韌、長壽、淡泊。", meaning: "菊花象徵堅韌，穩定地走自己的路，同樣值得肯定。" },
            { id: "26", name: "梅花", keywords: "盼望與迎新", quote: "「你走過的寒冷，不能定義你的全部。」", flower_meaning: "堅韌、盼望、迎向新局。", meaning: "梅花在寒冬中綻放，象徵困難中的韌性。堅強不代表不會累，累了也可以允許自己休息。" },
            { id: "27", name: "魯冰花", keywords: "默默的愛", quote: "「也許你不總是被看見，但你的付出依然有價值。」", flower_meaning: "奉獻、感恩、默默的愛。", meaning: "讓人聯想到默默付出的愛與對照顧者的感念。即使努力不一定被看見，也不代表你的付出沒有價值；你值得被肯定，也值得好好照顧自己。" }
        ];

        const dbName = "FlowerCardDB";
        let db;
        let savedImages = {};

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                request.onupgradeneeded = (event) => {
                    db = event.target.result;
                    if (!db.objectStoreNames.contains("images")) {
                        db.createObjectStore("images");
                    }
                };
                request.onsuccess = (event) => {
                    db = event.target.result;
                    resolve();
                };
                request.onerror = (event) => reject("資料庫開啟失敗");
            });
        }

        function saveImageToDB(name, dataUrl) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction("images", "readwrite");
                const store = tx.objectStore("images");
                store.put(dataUrl, name);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject();
            });
        }

        function loadAllImagesFromDB() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction("images", "readonly");
                const store = tx.objectStore("images");
                const request = store.getAll();
                const keysRequest = store.getAllKeys();
                tx.oncomplete = () => {
                    let images = {};
                    keysRequest.result.forEach((key, index) => {
                        images[key] = request.result[index];
                    });
                    resolve(images);
                };
            });
        }

        window.onload = async function() {
            try {
                await initDB();
                savedImages = await loadAllImagesFromDB();
            } catch (e) {
                console.error(e);
            }
        };

        function drawCard() {
            const randomIndex = Math.floor(Math.random() * flowers.length);
            const flower = flowers[randomIndex];
            
            document.getElementById('card-no').innerText = "NO." + flower.id;
            document.getElementById('card-title').innerText = flower.name;
            document.getElementById('card-subtitle').innerText = flower.keywords;
            document.getElementById('card-quote').innerText = flower.quote;
            document.getElementById('card-meaning-kw').innerText = flower.flower_meaning;
            document.getElementById('card-meaning-desc').innerText = flower.meaning;

            const imgDiv = document.getElementById('card-img');
            if (savedImages[flower.name]) {
                imgDiv.innerHTML = `<img src="${savedImages[flower.name]}" alt="${flower.name}">`;
            } else {
                imgDiv.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21,19V5C21,3.89 20.1,3 19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19M8.5,13.5L11,16.5L14.5,12L19,18H5L8.5,13.5Z"/></svg>尚無圖片`;
            }

            document.getElementById('card-container').style.display = 'block';
            document.getElementById('export-btn').style.display = 'block';
        }

        function exportCard() {
            const cardElement = document.getElementById('card-capture-area');
            setTimeout(() => {
                html2canvas(cardElement, { scale: 3, useCORS: true, backgroundColor: null }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `花語靈感卡-${document.getElementById('card-title').innerText}.png`;
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                });
            }, 300);
        }

        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            const main = document.getElementById('main-content');
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
                main.style.display = 'flex';
            } else {
                panel.style.display = 'block';
                main.style.display = 'none';
                renderAdminList();
            }
        }

        function renderAdminList() {
            const list = document.getElementById('admin-list');
            list.innerHTML = '';
            flowers.forEach(flower => {
                const item = document.createElement('div');
                item.className = 'admin-item';
                const imgSrc = savedImages[flower.name] || '';
                const imgHtml = imgSrc ? `<img src="${imgSrc}">` : `<div style="width:50px;height:50px;background:#f7f7f7;border:1px solid #eee;border-radius:5px;margin-right:15px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#aaa;">無圖</div>`;
                
                item.innerHTML = `
                    <div style="display:flex; align-items:center; flex:1;">
                        <input type="checkbox" class="print-cb" value="${flower.id}" checked>
                        ${imgHtml}
                        <strong style="margin-right:10px;color:var(--dark-green); width:60px;">${flower.name}</strong> 
                        <span style="font-size:12px;color:#888;">${flower.keywords}</span>
                    </div>
                    <input type="file" accept="image/*" class="file-input" onchange="handleSingleUpload(event, '${flower.name}')">
                `;
                list.appendChild(item);
            });
        }

        function toggleCheckboxes(check) {
            document.querySelectorAll('.print-cb').forEach(cb => cb.checked = check);
        }

        function processImageHighQuality(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 800;
                        let scaleSize = 1;
                        if (img.width > MAX_WIDTH) { scaleSize = MAX_WIDTH / img.width; }
                        
                        canvas.width = img.width * scaleSize;
                        canvas.height = img.height * scaleSize;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.95));
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            });
        }

        async function handleSingleUpload(event, flowerName) {
            const file = event.target.files[0];
            if (!file) return;
            const dataUrl = await processImageHighQuality(file);
            savedImages[flowerName] = dataUrl;
            await saveImageToDB(flowerName, dataUrl);
            renderAdminList();
        }

        async function handleBatchUpload(event) {
            const files = event.target.files;
            if (!files.length) return;

            let matchCount = 0;
            for (let file of files) {
                const fileName = file.name.replace(/\.[^/.]+$/, ""); 
                const matchedFlower = flowers.find(f => fileName.includes(f.name) || f.name.includes(fileName));
                
                if (matchedFlower) {
                    const dataUrl = await processImageHighQuality(file);
                    savedImages[matchedFlower.name] = dataUrl;
                    await saveImageToDB(matchedFlower.name, dataUrl);
                    matchCount++;
                }
            }
            
            renderAdminList();
            alert(`✅ 批次處理完成！共成功配對並儲存了 ${matchCount} 張圖片。`);
        }

        function generatePrintHTML(cardList) {
            const printArea = document.getElementById('print-area');
            printArea.innerHTML = '';
            
            cardList.forEach(flower => {
                const imgContent = savedImages[flower.name] 
                    ? `<img src="${savedImages[flower.name]}" style="width:100%;height:100%;object-fit:cover;">`
                    : `<svg viewBox="0 0 24 24" style="width:20px;fill:#ccc;"><path d="M21,19V5C21,3.89 20.1,3 19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19M8.5,13.5L11,16.5L14.5,12L19,18H5L8.5,13.5Z"/></svg>`;

                const cardHtml = `
                    <div class="print-card">
                        <div class="print-card-inner">
                            <div class="card-img-placeholder">${imgContent}</div>
                            <div class="card-header-row">
                                <div class="card-no">NO.${flower.id}</div>
                                <div class="card-title">${flower.name}</div>
                                <div class="card-pill">${flower.keywords}</div>
                            </div>
                            <div class="card-quote-box">
                                <div class="card-quote">${flower.quote}</div>
                            </div>
                            <div class="meaning-section">
                                <div class="meaning-row">
                                    <span class="meaning-label">花語</span>
                                    <span class="meaning-keywords">${flower.flower_meaning}</span>
                                </div>
                                <div class="meaning-desc">${flower.meaning}</span>
                            </div>
                        </div>
                    </div>
                `;
                printArea.innerHTML += cardHtml;
            });

            setTimeout(() => {
                window.print();
            }, 500);
        }

        function printAllCards() {
            generatePrintHTML(flowers);
        }

        function printSelectedCards() {
            const checkboxes = document.querySelectorAll('.print-cb:checked');
            const selectedIds = Array.from(checkboxes).map(cb => cb.value);
            
            if (selectedIds.length === 0) {
                alert("請至少勾選一張卡片喔！");
                return;
            }
            
            const selectedFlowers = flowers.filter(f => selectedIds.includes(f.id));
            generatePrintHTML(selectedFlowers);
        }
    </script>
</body>
